name: Build U-Boot for F660 (128MB NAND)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: msdos03/avanta-uboot-f660
        ref: master
        token: ${{ secrets.REPO_TOKEN }}

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev wget

    - name: Setup ARM cross compiler
      run: |
        wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/12.3.0/x86_64-gcc-12.3.0-nolibc-arm-linux-gnu.tar.xz
        tar -xf x86_64-gcc-12.3.0-nolibc-arm-linux-gnu.tar.xz
        echo "$PWD/gcc-12.3.0-nolibc/arm-linux-gnu/bin" >> $GITHUB_PATH

    - name: Modify configuration for 128MB NAND
      run: |
        sed -i 's/\(CONFIG_SYS_NAND_SIZE\s*\)0x[0-9a-fA-F]*/\10x8000000/' include/configs/*.h
        sed -i 's/\(MTDPARTS_DEFAULT.*\)0x1F00000/\10x1F00000/' include/configs/*.h || true
        echo "Config files modified:"

    - name: Build U-Boot
      run: |
        export CROSS_COMPILE=arm-linux-gnu-
        make clean
        make zte_f660_config
        make -j$(nproc)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-f660-128m-nand
        path: u-boot.bin
