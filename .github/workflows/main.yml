name: Build U-Boot for F660 (128MB NAND)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: msdos03/avanta-uboot-f660
        ref: master
        token: ${{ secrets.REPO_TOKEN }}

    - name: Install ARM cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

    - name: Modify configuration for 128MB NAND
      run: |
        # 将 NAND 总容量从 32MB 改为 128MB (0x8000000)
        sed -i 's/\(CONFIG_SYS_NAND_SIZE\s*\)0x[0-9a-fA-F]*/\10x8000000/' include/configs/*.h
        # 调整 UBI 分区大小（如果需要）
        sed -i 's/\(MTDPARTS_DEFAULT.*\)0x1F00000/\10x1F00000/' include/configs/*.h || true
        echo "Configuration modified for 128MB NAND"

    - name: Build U-Boot
      run: |
        export CROSS_COMPILE=arm-linux-gnueabi-
        make clean
        make zte_f660_config
        make -j$(nproc)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-f660-128m-nand
        path: u-boot.bin
